<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>英会話練習</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1976d2">

<style>
body{
    font-family:sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
}

.card{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

#question{
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
    color:#1976d2;
}

textarea{
    width:100%;
    height:180px;
    padding:10px;
    font-size:16px;
    box-sizing:border-box;
    border-radius:10px;
    border:1px solid #ccc;
}

.buttons{
    text-align:center;
    margin-top:15px;
}

button{
    border:none;
    background:#1976d2;
    color:white;
    padding:12px 18px;
    margin:5px;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    opacity:.9;
}

#history{
    margin-top:20px;
    white-space:pre-wrap;
}

.counter{
    margin-top:10px;
    color:#666;
}

.favorite{
    margin-top:20px;
    padding:10px;
    background:#fff8e1;
    border-radius:10px;
}
</style>
</head>
<body>

<div class="card">

<h1>🗣️ 英会話練習</h1>

<div id="question"></div>

<textarea
id="answer"
placeholder="英語で回答してください..."
></textarea>

<div class="counter">
文字数: <span id="count">0</span>
</div>

<div class="buttons">
<button onclick="nextQuestion()">🎲 ランダム問題</button>
<button onclick="saveAnswer()">💾 回答保存</button>
<button onclick="copyAnswer()">📋 コピー</button>
<button onclick="saveFavorite()">⭐ お気に入り</button>
<button onclick="clearAnswer()">🗑️ クリア</button>
</div>

<div class="favorite">
<h3>⭐ お気に入り問題</h3>
<div id="favorite"></div>
</div>

<div id="history">
<h3>📜 回答履歴</h3>
</div>

</div>

<script>

const questions = [
"What's your name?",
"Where are you from?",
"What do you do?",
"What are your hobbies?",
"What did you do yesterday?",
"What are your plans for this weekend?",
"What kind of food do you like?",
"Have you ever traveled abroad?",
"What is your favorite movie?",
"What would you do if you won a million dollars?",
"Tell me about your family.",
"How do you usually spend your holidays?",
"What is your dream job?",
"What do you like about Japan?",
"What is something you want to learn?"
];

const questionEl =
document.getElementById("question");

const answerEl =
document.getElementById("answer");

const countEl =
document.getElementById("count");

let currentQuestion = "";

function nextQuestion(){

    currentQuestion =
        questions[
            Math.floor(
                Math.random() * questions.length
            )
        ];

    questionEl.textContent =
        currentQuestion;

    localStorage.setItem(
        "currentQuestion",
        currentQuestion
    );
}

answerEl.addEventListener("input", () => {

    countEl.textContent =
        answerEl.value.length;

    localStorage.setItem(
        "draftAnswer",
        answerEl.value
    );

});

function saveAnswer(){

    if(!currentQuestion){
        alert("問題を表示してください");
        return;
    }

    let history =
        JSON.parse(
            localStorage.getItem(
                "englishHistory"
            ) || "[]"
        );

    history.unshift({
        date: new Date().toLocaleString(),
        question: currentQuestion,
        answer: answerEl.value
    });

    localStorage.setItem(
        "englishHistory",
        JSON.stringify(history)
    );

    loadHistory();

    alert("保存しました");
}

function loadHistory(){

    const historyDiv =
        document.getElementById("history");

    historyDiv.innerHTML =
        "<h3>📜 回答履歴</h3>";

    const history =
        JSON.parse(
            localStorage.getItem(
                "englishHistory"
            ) || "[]"
        );

    history.slice(0,10).forEach(item => {

        historyDiv.innerHTML += `
        <div style="
            margin-bottom:15px;
            padding:10px;
            background:#fafafa;
            border-radius:10px;
        ">
            <b>${item.date}</b><br>
            Q: ${item.question}<br>
            A: ${item.answer}
        </div>
        `;

    });

}

function copyAnswer(){

    navigator.clipboard
        .writeText(answerEl.value);

    alert("コピーしました");
}

function saveFavorite(){

    if(!currentQuestion){
        alert("問題を表示してください");
        return;
    }

    localStorage.setItem(
        "favoriteQuestion",
        currentQuestion
    );

    loadFavorite();

    alert("お気に入り保存");
}

function loadFavorite(){

    document.getElementById(
        "favorite"
    ).textContent =

    localStorage.getItem(
        "favoriteQuestion"
    ) || "未登録";
}

function clearAnswer(){

    if(!confirm("回答を削除しますか？")){
        return;
    }

    answerEl.value = "";

    countEl.textContent = "0";

    localStorage.removeItem(
        "draftAnswer"
    );
}

window.onload = () => {

    currentQuestion =
        localStorage.getItem(
            "currentQuestion"
        ) || questions[0];

    questionEl.textContent =
        currentQuestion;

    answerEl.value =
        localStorage.getItem(
            "draftAnswer"
        ) || "";

    countEl.textContent =
        answerEl.value.length;

    loadHistory();

    loadFavorite();
};

if("serviceWorker" in navigator){

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker
                .register("./service-worker.js")
                .then(() => {
                    console.log("Service Worker登録完了");
                })
                .catch(err => {
                    console.error(err);
                });

        }
    );
}

</script>
